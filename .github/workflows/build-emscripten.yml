# SPDX-License-Identifier: MPL-2.0
name: Build Emscripten
on:
  workflow_call:

jobs:
  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            substituters = https://cache.nixos.org
            experimental-features = nix-command flakes
      - name: Build all configurations
        run: |
          nix develop --ignore-environment --keep HOME ".#devShells.x86_64-linux.emscripten" -c ./tools/build-emscripten.sh
      - name: Package
        run: |
          nix develop --ignore-environment --keep HOME ".#devShells.x86_64-linux.emscripten" -c ./tools/package-emscripten.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: prism-wasm.zip
