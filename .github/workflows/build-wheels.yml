# SPDX-License-Identifier: MPL-2.0
name: Build Wheels
on:
  workflow_call:

jobs:
  wheels:
    name: Build wheels for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
            archs: native
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
            archs: native
          - os: windows-intel
            runs-on: windows-latest
            archs: native
          - os: windows-arm
            runs-on: windows-11-arm
            archs: native
          - os: macos-intel
            runs-on: macos-26-intel
            archs: native
          - os: macos-arm
            runs-on: macos-26
            archs: native
          - os: android-intel
            runs-on: ubuntu-latest
            platform: android
            archs: native
          - os: android-arm
            runs-on: ubuntu-latest
            platform: android
            archs: arm64_v8a
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install current CMake
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: latest
      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        env:
          ANDROID_API_LEVEL: 26
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: ${{ matrix.archs || 'auto64' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
