# SPDX-License-Identifier: MPL-2.0
name: Build Windows
on:
  workflow_call:

jobs:
  windows:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: x64,   msvc_arch: amd64,       extra_cmake: "" }
          - { name: arm64, msvc_arch: amd64_arm64,  extra_cmake: "-DCMAKE_SYSTEM_PROCESSOR=ARM64" }
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MSVC
        id: msvc
        uses: $/.github/actions/setup-msvc
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install the Microsoft GDK
        id: gdk
        uses: $/.github/actions/install-gdk
      - name: Install current CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: latest
      - name: Build all configurations
        shell: pwsh
        env:
          PRISM_GDK_ROOT: ${{ steps.gdk.outputs.root }}
          PATH: ${{ steps.msvc.outputs.path }}
          INCLUDE: ${{ steps.msvc.outputs.include }}
          LIB: ${{ steps.msvc.outputs.lib }}
          LIBPATH: ${{ steps.msvc.outputs.libpath }}
          VSINSTALLDIR: ${{ steps.msvc.outputs.vsinstalldir }}
        run: |
          foreach ($shared in @("ON", "OFF")) {
            $linkage = if ($shared -eq "ON") { "dynamic" } else { "static" }
            foreach ($bt in @("Release", "Debug")) {
              $config = $bt.ToLower()
              cmake -B "build-${linkage}-${config}" `
                -G Ninja `
                -DPRISM_ENABLE_TESTS=OFF `
                -DPRISM_ENABLE_DEMOS=OFF `
                -DPRISM_ENABLE_SHIMS=ON `
                -DPRISM_ENABLE_LEGACY_BACKENDS=ON `
                -DPRISM_ENABLE_GDK_SPEECH_BACKEND=ON `
                "-DCMAKE_BUILD_TYPE=$bt" `
                "-DBUILD_SHARED_LIBS=$shared" `
                -DPRISM_ENABLE_GDEXTENSION=OFF ${{ matrix.extra_cmake }}
              cmake --build "build-${linkage}-${config}"
            }
          }
      - name: Package
        shell: pwsh
        run: |
          foreach ($shared in @("ON", "OFF")) {
            $linkage = if ($shared -eq "ON") { "dynamic" } else { "static" }
            foreach ($bt in @("Release", "Debug")) {
              $config = $bt.ToLower()
              if (Test-Path "dist/${linkage}/${config}") {
                Remove-Item "dist/${linkage}/${config}" -Recurse -Force
              }
              cmake --install "build-${linkage}-${config}" `
                    --prefix  "dist/${linkage}/${config}" `
                    --config  $bt
            }
          }
          Copy-Item -Recurse dist/dynamic/release/include dist/include
          Copy-Item -Recurse LICENSES dist/
          Copy-Item NOTICE dist/
          Compress-Archive -Path dist/* -DestinationPath "prism-windows-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.name }}
          path: prism-windows-${{ matrix.name }}.zip
