# SPDX-License-Identifier: MPL-2.0
name: Lint Android
on:
  workflow_call:

env:
  CMAKE_COMMON: >-
    -G Ninja
    -DPRISM_ENABLE_TESTS=OFF
    -DPRISM_ENABLE_DEMOS=OFF
    -DPRISM_ENABLE_LEGACY_BACKENDS=ON
    -DPRISM_ENABLE_SHIMS=ON
    -DPRISM_ENABLE_LINTING=ON

jobs:
  lint:
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r29
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Lint C++ code
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          for shared in ON OFF; do
            linkage=$( [ "$shared" = "ON" ] && echo "dynamic" || echo "static" )
            config=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
            cmake -B "build-${linkage}-${config}" ${{ env.CMAKE_COMMON }} \
              -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
              -DBUILD_SHARED_LIBS="$shared" \
              -DPRISM_ENABLE_GDEXTENSION=OFF \
              "-DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
              "-DANDROID_ABI=${{ matrix.abi }}" \
              -DANDROID_PLATFORM=android-30
            cmake --build "build-${linkage}-${config}" --target prism
          done
  lint-java:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r29
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Lint
        run: ./gradlew :lint --continue --no-daemon --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: |
            build/android/gradle/reports/lint-results-*.html
            build/android/gradle/reports/lint-results-*.xml
            build/android/gradle/reports/lint-results-*.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: build/android/gradle/reports/lint-results-debug.sarif
          wait-for-processing: true
