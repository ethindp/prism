# SPDX-License-Identifier: MPL-2.0
name: Lint Xbox
on:
  workflow_call:

jobs:
  lint:
    name: lint (${{ matrix.compiler.name }}, ${{ matrix.console }}, GXDK macros ${{ matrix.gxdk-macros }})
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: msvc,       c: cl,    cxx: cl }
          - { name: clang-tidy, c: clang, cxx: clang++ }
        console: [xboxone, scarlett]
        gxdk-macros: ['OFF', 'ON']
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MSVC
        id: msvc
        uses: $/.github/actions/setup-msvc
        with:
          arch: amd64
      - name: Install the Microsoft GDK
        id: gdk
        uses: $/.github/actions/install-gdk
      - name: Install current CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: latest
      - name: Set up LLVM toolchain if needed
        if: matrix.compiler.name == 'clang-tidy'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-tidy -ErrorAction SilentlyContinue)) {
            choco install -y llvm
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Lint all configurations
        shell: pwsh
        env:
          PRISM_GDK_ROOT: ${{ steps.gdk.outputs.root }}
          PATH: ${{ steps.msvc.outputs.path }}
          INCLUDE: ${{ steps.msvc.outputs.include }}
          LIB: ${{ steps.msvc.outputs.lib }}
          LIBPATH: ${{ steps.msvc.outputs.libpath }}
          VSINSTALLDIR: ${{ steps.msvc.outputs.vsinstalldir }}
          C_COMPILER: ${{ matrix.compiler.c }}
          CXX_COMPILER: ${{ matrix.compiler.cxx }}
          XBOX_CONSOLE: ${{ matrix.console }}
          GXDK_MACROS: ${{ matrix.gxdk-macros }}
        run: |
          $toolchain = Join-Path $PWD "cmake/xbox-toolchain.cmake"
          foreach ($shared in @("ON", "OFF")) {
            $linkage = if ($shared -eq "ON") { "dynamic" } else { "static" }
            foreach ($bt in @("Release", "Debug")) {
              $config = $bt.ToLower()
              cmake -B "build-${linkage}-${config}" `
                -G Ninja `
                "-DCMAKE_C_COMPILER=$env:C_COMPILER" `
                "-DCMAKE_CXX_COMPILER=$env:CXX_COMPILER" `
                "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
                "-DXBOX_CONSOLE_TARGET=$env:XBOX_CONSOLE" `
                "-DPRISM_XBOX_GXDK_MACROS=$env:GXDK_MACROS" `
                -DPRISM_CONSOLE_TARGET=XBOX `
                -DPRISM_ENABLE_GDK_SPEECH_BACKEND=ON `
                -DPRISM_ENABLE_TESTS=OFF `
                -DPRISM_ENABLE_DEMOS=OFF `
                -DPRISM_ENABLE_LINTING=ON `
                -DPRISM_ENABLE_GDEXTENSION=OFF `
                "-DCMAKE_BUILD_TYPE=$bt" `
                "-DBUILD_SHARED_LIBS=$shared"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              cmake --build "build-${linkage}-${config}" --target prism
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
